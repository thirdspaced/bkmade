<style>
/* Layout: one tall painted scene (fire escape, river, skyline) held whole in the middle of the screen, its own colours blurred out behind it, a two-line caption in the corner */
:root{
  --room:#0b0a14; --ink:#12101c; --paper:#fdf6e3; --butter:#f8d682; --sky:#8acbfa;
  --pixel:"Pixelify Sans","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--room);color:var(--paper);font:400 14px/1.25 var(--pixel);overflow:hidden}
.bg{position:fixed;inset:-56px;background:url(a/scene.jpg) center/cover;filter:blur(30px) brightness(var(--dim,.4));z-index:0}
#c{position:fixed;left:0;top:0;z-index:1;display:block;touch-action:manipulation}
#c.px{image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:fixed;z-index:2;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;pointer-events:none;text-shadow:1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink);letter-spacing:.04em}
.hud b{font-weight:700;color:var(--butter);font-variant-numeric:tabular-nums}
.live{color:var(--paper);font-weight:700}
.live i{display:inline-block;width:8px;height:8px;background:#ff3b3b;margin-right:6px;animation:rec 1.2s steps(2) infinite}
@keyframes rec{50%{opacity:.15}}
#wx{color:var(--sky)}
.home{color:var(--paper);pointer-events:auto}
#toast{transition:opacity .6s}
#toast.off{opacity:0}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.live i{animation:none}}
</style>
</head>

  for(let y=481;y<716;y+=6){const ph=Math.sin(t*.9+y*.02)*3*(y-481)/235;for(let x=724;x<772;x+=4){const f=(((x-728+ph)/4|0)%3+3)%3;ctx.fillStyle=['#345452','#284242','#1e3234'][f];ctx.fillRect(x,y,4,6)}}ctx.restore();
  /* the pigeon on the rail nods and blinks */
  const m=mate;m.nextNod-=dt;m.nextBlink-=dt;m.nod=Math.max(0,m.nod-dt);m.blink=Math.max(0,m.blink-dt);if(m.nextNod<=0){m.nod=.28;m.nextNod=rnd(4,11)}if(m.nextBlink<=0){m.blink=.16;m.nextBlink=rnd(2.5,6)}
  if(m.nod>0&&IMG.scene)ctx.drawImage(IMG.scene,260,512,46,34,262,515,46,34);
  if(m.blink>0){const dx=m.nod>0?2:0,dy=m.nod>0?3:0;ctx.fillStyle='#5d6a82';ctx.fillRect(274+dx,525+dy,9,8);ctx.fillStyle='#2a2e3c';ctx.fillRect(275+dx,529+dy,7,2)}
  /* leaves, and now and then a plastic bag */
  if(leaves.length<(wind>4?4:1)&&Math.random()<dt*.4)leaves.push({x:-10,y:rnd(250,800),p:rnd(0,6),v:rnd(30,70)+wind*4,c:['#e8862e','#d85a2a','#e8c040','#b8482a'][Math.random()*4|0]});
  for(let i=leaves.length-1;i>=0;i--){const l=leaves[i];l.x+=l.v*dt;l.p+=dt*3;l.y+=(Math.sin(l.p)*18+14)*dt;if(l.x>W+10){leaves.splice(i,1);continue}ctx.fillStyle=l.c;const fl=Math.sin(l.p*2)>0;ctx.fillRect(l.x&~1,l.y&~1,fl?6:4,fl?4:6)}
  if(!bag.on){bag.wait-=dt;if(bag.wait<=0){bag.on=true;bag.x=-20;bag.y=rnd(380,640);bag.p=0}}
  else{bag.x+=(26+wind*3)*dt;bag.p+=dt;bag.y+=Math.sin(bag.p*1.3)*26*dt-4*dt;const x=bag.x&~1,y=bag.y&~1,sq=Math.sin(bag.p*4)>0;ctx.fillStyle='#1c1622';ctx.fillRect(x-2,y-2,sq?16:14,sq?16:18);ctx.fillStyle='#f4f4f0';ctx.fillRect(x,y,sq?12:10,sq?12:14);ctx.fillStyle='#cfd2d8';ctx.fillRect(x+2,y+6,6,4);ctx.fillStyle='#f4f4f0';ctx.fillRect(x+2,y-4,2,4);ctx.fillRect(x+6,y-4,2,4);if(bag.x>W+30){bag.on=false;bag.wait=rnd(50,120)}}}

/* ---------- the pigeon ---------- */
let gifts=store.get('escape.gifts',[]).filter(i=>GIFTS[i]),bird={s:'roost',t:rnd(12,20),p:0,item:-1,bob:0,coo:0};
function flyPos(p){const a=[NEST.x-6,NEST.y-34],b=[330,540],c=[-70,320],q=1-p;return[q*q*a[0]+2*q*p*b[0]+p*p*c[0],q*q*a[1]+2*q*p*b[1]+p*p*c[1]]}
function tickBird(dt){const b=bird,w=env.w;b.bob=Math.max(0,b.bob-dt);b.coo=Math.max(0,b.coo-dt);
  if(b.s==='roost'){b.t-=dt;if(Math.random()<dt/7)b.bob=.3;
    if(b.t<=0){if(env.night||wet(w.kind)||w.kind==='snow'||reduce)b.t=rnd(20,40);else{b.s='out';b.p=0}}}
  else if(b.s==='out'){b.p+=dt/2.6;if(b.p>=1){b.s='away';b.t=rnd(AWAY[0],AWAY[1])}}
  else if(b.s==='away'){b.t-=dt;if(b.t<=0){b.s='back';b.p=1;b.item=Math.random()*GIFTS.length|0}}
  else if(b.s==='back'){b.p-=dt/3;if(b.p<=0){b.s='roost';b.t=rnd(ROOST[0],ROOST[1]);gifts.push(b.item);if(gifts.length>6)gifts.shift();store.set('escape.gifts',gifts);
      toast('she brought back '+GIFTS[b.item][0]+'.');b.item=-1;b.bob=.5}}}
function blocks(rows,pal,x,y,s){for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){const c=pal[rows[j][i]];if(c){ctx.fillStyle='#1c1622';ctx.fillRect(x+i*s-1,y+j*s-1,s+2,s+2)}}
  for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){const c=pal[rows[j][i]];if(c){ctx.fillStyle=c;ctx.fillRect(x+i*s,y+j*s,s,s)}}}
function drawBird(t){const b=bird,{x,y}=NEST;
  gifts.forEach((g,i)=>{const s=GIFTS[g];blocks(s[1],s[2],x-62-i*22-s[1][0].length*3,y+16-s[1].length*3-(i%2)*4,3)});
  if(IMG.nest_b)ctx.drawImage(IMG.nest_b,x-46,y-16);
  if(b.s==='roost'){if(IMG.hen){const hw=72,hh=53,up=b.bob>0?-2:0,low=env.night?4:0;ctx.drawImage(IMG.hen,x-34,y-hh+10+up+low,hw,hh)}
    if(b.coo>0){ctx.fillStyle='#fdf6e3';const yy=y-52-((1.2-b.coo)*10|0);ctx.fillRect(x-44,yy+2,3,5);ctx.fillRect(x-50,yy,3,8);ctx.fillRect(x-56,yy+2,3,5)}}
  else if(IMG.egg){ctx.drawImage(IMG.egg,x-18,y-12);ctx.drawImage(IMG.egg,x+2,y-10)}
  if(IMG.nest_f)ctx.drawImage(IMG.nest_f,x-46,y-16);
  if(b.s==='out'||b.s==='back'){const[fx_,fy]=flyPos(b.p),sc=lerp(.62,.82,b.p),f=IMG[(t*8|0)%2?'fly1':'fly2'],left=b.s==='out';if(!f)return;
    ctx.save();ctx.translate(fx_|0,fy|0);ctx.scale(left?-sc:sc,sc);ctx.drawImage(f,-96,-84);ctx.restore();
    if(!left&&b.item>=0){const s=GIFTS[b.item];blocks(s[1],s[2],(fx_+62*sc)|0,(fy-2*sc)|0,3)}}}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  if(bird.s==='roost'&&Math.abs(x-NEST.x)<60&&Math.abs(y-(NEST.y-16))<50){bird.coo=1.2;bird.bob=.4;if(!env.night)toast('coo.')}});

/* ---------- hud ---------- */
let toastT;function toast(s){const el=$('#toast');el.textContent=s;el.classList.remove('off');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.add('off'),7000)}
function hud(){const w=W_();$('#clock').textContent='BROOKLYN '+new Intl.DateTimeFormat('en-US',{timeZone:NYC,hour:'numeric',minute:'2-digit',second:'2-digit'}).format(now());
  $('#wx').textContent=forced?'preview: '+WX_LABEL[forced]:w.live?`${w.temp}°F ${WX_LABEL[w.kind]}`:''}

/* ---------- frame ---------- */
const PANES=[[[612,236],[768,236],[768,428],[612,428]],[[637,481],[768,481],[768,716],[704,690],[668,672],[637,652]]];
const rain=[],snow=[];for(let i=0;i<260;i++)rain.push({x:Math.random()*(W+200),y:Math.random()*H,v:900+Math.random()*500});
for(let i=0;i<240;i++)snow.push({x:Math.random()*W,y:Math.random()*H,v:40+Math.random()*60,p:Math.random()*6.28,s:Math.random()<.3?4:2});
let last=0,flash=0,nextBolt=6;
function frame(tm){requestAnimationFrame(frame);const step=reduce?1000:66;if(tm-last<step)return;const dt=Math.min(.25,(tm-last)/1000);last=tm;const t=tm/1000;
  envT+=dt;if(envT>10){envT=0;computeEnv();hud()}
  const w=env.w,k=w.kind;ctx.imageSmoothingEnabled=false;ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  if(IMG.scene)ctx.drawImage(IMG.scene,0,0);else{ctx.fillStyle='#3d7cc6';ctx.fillRect(0,0,W,H)}
  if(IMG.skyplate&&IMG.sky){drawSkyLayer(t,dt);ctx.drawImage(skyL,0,0)}
  ctx.drawImage(fx,0,0);
  if(IMG.river&&IMG.scene){drawRiverLayer(t,dt);ctx.drawImage(rivL,0,0)}
  if(k==='fog'||wet(k)||k==='snow'){const a=k==='fog'?.62:.26;for(let y=150;y<640;y+=8){ctx.fillStyle=`rgba(196,202,210,${(a*(y<300?(y-150)/150:y<480?1:1-(y-480)/160)).toFixed(3)})`;ctx.fillRect(0,y,338,8);ctx.fillRect(372,y,131,8)}}
  drawLife(t,dt);tickBird(dt);drawBird(t);
  /* grade the whole picture for the hour and the weather */
  if(env.g>.05){ctx.globalCompositeOperation='saturation';ctx.globalAlpha=env.g*.5;ctx.fillStyle='#808080';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  ctx.globalCompositeOperation='multiply';ctx.fillStyle=env.tint;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  /* lights come on */
  if(env.lit>0){const a=env.lit;
    if(IMG.scene){ctx.save();ctx.beginPath();for(const p of PANES){ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath()}ctx.clip();
      ctx.globalAlpha=a*.92;ctx.drawImage(IMG.scene,0,0);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*.55;ctx.drawImage(IMG.scene,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=a*.14;ctx.fillStyle='#ffb054';ctx.fillRect(600,230,170,490);ctx.restore()}
    ctx.drawImage(mfx,0,0);
    const cols=['#ffd98a','#ffeec0','#a8d8ff'];for(const p of PTS.lights)if(Math.sin(t*.25+p[0]*.7+p[1])>-.85){ctx.globalAlpha=a;ctx.fillStyle=cols[p[2]];ctx.fillRect(p[0],p[1],2,2)}
    ctx.globalAlpha=a*((t|0)%2?1:.3);ctx.fillStyle='#ff5050';ctx.fillRect(82,266,2,2);
    ctx.globalAlpha=a;for(const cr of cars){const[x,y]=deck(cr.p);ctx.fillStyle=cr.v>0?'#fff2c0':'#ff5a4a';ctx.fillRect(x&~1,(y&~1)-2,2,2)}
    for(const b of boats)if(b.wait<=0&&b.x>150&&b.x<500&&(b.x<336||b.x>374)){ctx.fillStyle='#ffe9b0';ctx.fillRect((b.x&~1)+(b.big?10:4),b.y-(b.big?2:12),2,2)}
    const sa=clamp((-env.el-4)/8,0,1)*(1-env.g);if(sa>0)for(const p of PTS.stars){const tw=(Math.sin(t*1.4+p[0]+p[1]*.3)+1)/2;if(tw>.3){ctx.globalAlpha=sa*(tw>.8?1:.6);ctx.fillStyle='#e8ecff';ctx.fillRect(p[0],p[1],2,2)}}
    ctx.globalAlpha=1}
  /* weather in the air */
  if(wet(k)){const n=rain.length*(k==='drizzle'?.3:k==='rain'?.65:1)|0;ctx.fillStyle='rgba(204,220,240,.55)';for(let i=0;i<n;i++){const p=rain[i];p.y+=p.v*dt*(k==='drizzle'?.6:1);p.x-=p.v*dt*.2;if(p.y>H){p.y=-20;p.x=Math.random()*(W+200)}
      const x=p.x&~1,y=p.y&~1;ctx.fillRect(x,y,2,8);ctx.fillRect(x-2,y+8,2,6)}}
  if(k==='snow'){ctx.fillStyle='#ffffff';for(const p of snow){p.y+=p.v*dt;p.p+=dt;if(p.y>H){p.y=-4;p.x=Math.random()*W}ctx.fillRect(((p.x+Math.sin(p.p)*14+W)%W)&~1,p.y&~1,p.s,p.s)}}
  if(k==='storm'){nextBolt-=dt;flash=Math.max(0,flash-dt*4);if(nextBolt<=0){nextBolt=rnd(5,16);flash=1}if(flash>0){ctx.fillStyle=`rgba(236,240,255,${flash*.45})`;ctx.fillRect(0,0,W,H)}}else flash=0}

/* ---------- fit the picture to the screen ---------- */
function fit(){const vw=innerWidth,vh=innerHeight,wide=vw/vh>W/H,s=wide?vw/W:Math.min(vw/W,vh/H),w=Math.ceil(W*s),h=Math.ceil(H*s);   // wide screens: fill the width and frame the skyline, the fire escape and the window
  cv.style.width=w+'px';cv.style.height=h+'px';cv.style.left=Math.round((vw-w)/2)+'px';cv.style.top=Math.round(wide?clamp(vh/2-560*s,vh-h,0):(vh-h)/2)+'px';cv.classList.toggle('px',s>=1.4)}
addEventListener('resize',fit);fit();

/* ---------- previews: #rain, #snow-night, #dusk ... or keys W (weather), T (+1 hour), F (send her out), R (back to live) ---------- */
const HOURS={night:1,dawn:6.6,morning:9,noon:12.5,afternoon:15,dusk:16.5,evening:19};
function applyHash(){forced=null;tOff=0;for(const p of location.hash.slice(1).toLowerCase().split('-')){if(PRESET[p])forced=p;if(HOURS[p]!==undefined)tOff=(HOURS[p]-nycHour(new Date()))*36e5}envT=99}
addEventListener('hashchange',applyHash);
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),ks=Object.keys(PRESET);
  if(k==='w')forced=ks[(ks.indexOf(forced)+1)%ks.length];else if(k==='t')tOff+=36e5;else if(k==='f'){if(bird.s==='roost')bird.t=0}else if(k==='r'){forced=null;tOff=0}else return;envT=99});
applyHash();computeEnv();hud();getWeather();setInterval(getWeather,6e5);setInterval(hud,1000);requestAnimationFrame(frame);
Promise.all(['scene','sky','skyplate','river','plant','hen','fly1','fly2','nest_b','nest_f','egg'].map(load)).then(()=>{envT=99});
window.__escape={bird};
})();
</script>
