<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A Brooklyn window, a fire escape, a pigeon. New York's real time and weather.">
<title>Escape</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap">
<style>body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: one full-screen pixel canvas (a window, a fire escape, the river, the skyline) with a two-line caption sitting on the wall under the sill */
:root{
  --room:#0d0b1e; --ink:#1d1b2e; --paper:#fdf6e3; --butter:#f8d682; --sky:#8acbfa;
  --pixel:"Pixelify Sans","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--room);color:var(--paper);font:400 14px/1.25 var(--pixel);overflow:hidden}
#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.hud{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;pointer-events:none;text-shadow:1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink);letter-spacing:.04em}
.hud b{font-weight:700;color:var(--butter);font-variant-numeric:tabular-nums}
#wx{color:var(--sky)}
#toast{color:var(--paper);transition:opacity .6s}
#toast.off{opacity:0}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<canvas id="c" role="img" aria-label="Pixel art view through a Brooklyn window: a fire escape with a pigeon nest, the East River and the Manhattan skyline, in New York's current time and weather"></canvas>
<div class="hud"><b id="clock">BROOKLYN</b><span id="wx"></span><span id="toast" class="off" aria-live="polite"></span></div>

<script>
(()=>{
/* ====== edit me ====== */
const GIFTS=[
  ['a french fry',['yyyyyo','.oyyyy'],{y:'#f8d060',o:'#d89a30'}],
  ['a pizza crust',['ttttt.','.ttto.'],{t:'#e6b878',o:'#c08040'}],
  ['a bottle cap',['.rrr.','rRRRr','.rrr.'],{r:'#d83a3a',R:'#f47a6a'}],
  ['an old metrocard',['yyyyyy','ybbbby','yyyyyy'],{y:'#f8d040',b:'#2a5ab8'}],
  ['a twig',['t..t..','ttttt.','...t..'],{t:'#7a5030'}],
  ['half a bagel',['.tt.','t..t','.tt.'],{t:'#d8a060'}],
  ['a gum wrapper',['sSs','SsS'],{s:'#c8d0d8',S:'#f4f8fc'}],
  ['a pink ribbon',['p.p','ppp','p.p'],{p:'#ea3f98'}],
  ['a flower',['.p.','pyp','.p.'],{p:'#f8a8c8',y:'#f8d040'}],
  ['a quarter',['.gg.','gGGg','.gg.'],{g:'#b8bcc8',G:'#eef0f6'}],
  ['a button',['.bb.','b..b','.bb.'],{b:'#3a8ad8'}],
  ["somebody's earring",['.c.','cCc','.c.'],{c:'#9ae0f8',C:'#ffffff'}],
  ['a bodega receipt',['www','wgw','www','wgw'],{w:'#f0f0e8',g:'#a0a0a8'}]
];
const ROOST=[30,75], AWAY=[10,22];      // seconds she sits, seconds she is gone
/* ===================== */

const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
function seeded(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- time: New York's clock ---------- */
const NYC='America/New_York';let tOff=0;
const now=()=>new Date(Date.now()+tOff);
const nycHour=d=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:NYC,hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(d);return +p.find(x=>x.type==='hour').value+(+p.find(x=>x.type==='minute').value)/60};
function sunAt(date){const r=Math.PI/180,lat=40.703*r,lon=-73.99,d=(date-Date.UTC(2000,0,1,12))/864e5;
  const g=(357.529+.98560028*d)*r,q=280.459+.98564736*d,Ls=(q+1.915*Math.sin(g)+.02*Math.sin(2*g))*r,e=(23.439-36e-8*d)*r;
  const ra=Math.atan2(Math.cos(e)*Math.sin(Ls),Math.cos(Ls)),dec=Math.asin(Math.sin(e)*Math.sin(Ls));
  const ha=(((18.697374558+24.06570982441908*d)%24)*15+lon)*r-ra;
  const el=Math.asin(Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(ha));
  const az=Math.atan2(-Math.sin(ha),Math.tan(dec)*Math.cos(lat)-Math.sin(lat)*Math.cos(ha));
  return{el:el/r,az:(az/r+360)%360}}
const moonPhase=d=>(((d-Date.UTC(2000,0,6,18,14))/864e5/29.530588)%1+1)%1;

/* ---------- weather: Open-Meteo, lower Manhattan / DUMBO ---------- */
const WX_URL='https://api.open-meteo.com/v1/forecast?latitude=40.7033&longitude=-73.9903&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m,precipitation&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York';
const WX_LABEL={clear:'clear',cloudy:'partly cloudy',overcast:'overcast',fog:'fog',drizzle:'drizzle',rain:'rain',storm:'thunderstorm',snow:'snow'};
const PRESET={clear:{cc:.05},cloudy:{cc:.45},overcast:{cc:.95},fog:{cc:.9},drizzle:{cc:.9},rain:{cc:1},storm:{cc:1},snow:{cc:.95}};
let wx={kind:'cloudy',cc:.35,wind:6,temp:null,live:false},forced=null;
function kindOf(code,cc){if(code>=95)return'storm';if((code>=71&&code<=77)||code===85||code===86)return'snow';
  if((code>=61&&code<=67)||(code>=80&&code<=82))return'rain';if(code>=51&&code<=57)return'drizzle';if(code===45||code===48)return'fog';
  return cc>.85?'overcast':cc>.2?'cloudy':'clear'}
function getWeather(){fetch(WX_URL).then(r=>r.json()).then(j=>{const c=j.current,cc=c.cloud_cover/100;
  wx={kind:kindOf(c.weather_code,cc),cc,wind:c.wind_speed_10m,temp:Math.round(c.temperature_2m),live:true};dirty=true;hud()}).catch(()=>{})}
const W_=()=>forced?{kind:forced,cc:PRESET[forced].cc,wind:forced==='storm'?22:8,temp:wx.temp,live:false}:wx;
const wet=k=>k==='drizzle'||k==='rain'||k==='storm';

/* ---------- layout ---------- */
let W,H,S,L,dirty=true,layers={};
function fit(){const vw=innerWidth,vh=innerHeight;S=Math.max(2,Math.round(Math.min(vh/210,vw/150)));W=Math.ceil(vw/S);H=Math.ceil(vh/S);
  cv.width=W;cv.height=H;cv.style.width=W*S+'px';cv.style.height=H*S+'px';
  const wall=Math.max(7,Math.round(W*.06)),ft=5,top=Math.max(9,Math.round(H*.07)),sillY=H-Math.max(26,Math.round(H*.15));
  const gx0=wall+ft,gx1=W-wall-ft,gy0=top+ft,gy1=sillY-ft,gw=gx1-gx0,gh=gy1-gy0;
  const hz=gy0+Math.round(gh*.5),plat=gy1-15;
  L={wall,ft,top,sillY,gx0,gx1,gy0,gy1,gw,gh,hz,plat,skyH:hz-gy0,railTop:plat-34,rail:gy0+Math.round(gh*.22),
     bT:gy0+Math.round(gh*.61),wx1:gx0+Math.round(gw*.6),x2:gx0+Math.round(gw*.73),bT2:gy0+Math.round(gh*.67),
     nx:gx0+Math.max(6,Math.round(gw*.07)),ny:plat+10,lad:gx1-Math.max(20,Math.round(gw*.1))};
  for(const k of['sky','city','near','iron','room']){const c=document.createElement('canvas');c.width=W;c.height=H;layers[k]=c}
  build();dirty=true}

/* ---------- colour ---------- */
let amb=[1,1,1],ambI=[.7,.7,.7],cA=new Map(),cI=new Map(),env={};
const sh=(hex,a,m)=>{let c=m.get(hex);if(!c){const n=parseInt(hex.slice(1),16);c=rgb([Math.min(255,(n>>16&255)*a[0]),Math.min(255,(n>>8&255)*a[1]),Math.min(255,(n&255)*a[2])]);m.set(hex,c)}return c};
const A=h=>sh(h,amb,cA),I=h=>sh(h,ambI,cI);
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x|0,y|0,w|0,h|0)}
function spr(c,rows,x,y,pal,f,flip){for(let j=0;j<rows.length;j++){const r=rows[j];for(let i=0;i<r.length;i++){const ch=r[flip?r.length-1-i:i];if(pal[ch]){c.fillStyle=f?f(pal[ch]):pal[ch];c.fillRect((x|0)+i,(y|0)+j,1,1)}}}}
const SKY=[[-14,[8,8,30],[20,22,58]],[-6,[22,26,84],[128,74,124]],[-1,[54,74,156],[250,142,92]],[4,[84,146,224],[250,204,146]],[14,[58,138,226],[172,216,250]]];
function skyCols(el){let i=0;while(i<SKY.length-2&&el>SKY[i+1][0])i++;const a=SKY[i],b=SKY[i+1],t=clamp((el-a[0])/(b[0]-a[0]),0,1);return[mix(a[1],b[1],t),mix(a[2],b[2],t)]}
function computeEnv(){const d=now(),s=sunAt(d),w=W_(),day=clamp((s.el+6)/14,0,1),gold=Math.max(0,1-Math.abs(s.el-2)/8);
  let[top,bot]=skyCols(s.el);const grey=wet(w.kind)||w.kind==='snow'?Math.max(w.cc,.95):w.cc,g=Math.pow(grey,1.6);
  const dim=w.kind==='storm'?.62:wet(w.kind)?.8:1;
  top=mix(top,mix([20,22,36],[128,138,152],day).map(v=>v*dim),g);bot=mix(bot,mix([32,34,50],[186,192,200],day).map(v=>v*dim),g);
  let t=mix([.33,.37,.64],[1,1,1],day);t=[t[0]*(1+.12*gold*(1-g)),t[1]*(1-.02*gold),t[2]*(1-.22*gold*(1-g))].map(v=>v*(1-.2*g)*(.55+.45*dim));
  const key=t.map(v=>v.toFixed(2)).join()+w.kind+(top.concat(bot).map(v=>v|0).join());
  if(key!==env.key){amb=t;ambI=mix([.4,.34,.42],[.72,.68,.7],day);cA.clear();cI.clear();dirty=true}
  env={key,el:s.el,az:s.az,day,gold,top,bot,night:s.el<-5,dusk:s.el<1,w,date:d,hour:nycHour(d)}}

/* ---------- static scene geometry (rebuilt on resize) ---------- */
let sky={far:[],near:[],lights:[],stars:[]},clouds=[],drops=[],rain=[],snow=[];
function build(){const r=seeded(11),{gx0,gx1,gw,hz,skyH,gy0}=L;sky={far:[],near:[],lights:[],stars:[]};
  const hill=u=>.5+.62*Math.exp(-Math.pow((u-.2)/.17,2))+.2*Math.exp(-Math.pow((u-.72)/.1,2));
  for(const[key,lo,hi,minw]of[['far',.2,.5,4],['near',.1,.3,5]]){let x=gx0-3;while(x<gx1+3){const w=minw+(r()*7|0),u=(x-gx0)/gw,h=Math.max(5,(lo+r()*(hi-lo))*hill(u)*skyH*.84|0);
      sky[key].push({x,w,h,step:r()<.3,ant:r()<.18});x+=w+(r()<.25?1:0)}}
  sky.spire={x:gx0+Math.round(gw*.19),h:Math.min(skyH-9,Math.round(skyH*.86))};
  for(const k of['far','near'])for(const b of sky[k])for(let y=hz-6-b.h+2;y<hz-7;y+=3)for(let x=b.x+1;x<b.x+b.w-1;x+=2)if(r()<.36)sky.lights.push({x,y,p:r(),c:r()<.12?'#a8d8ff':r()<.5?'#ffd98a':'#ffeec0'});
  for(let y=hz-6-sky.spire.h+10;y<hz-8;y+=3)for(let x=0;x<7;x+=2)if(r()<.5)sky.lights.push({x:sky.spire.x+x,y,p:r(),c:'#cfe8ff'});
  for(let i=0;i<gw*skyH/70;i++)sky.stars.push({x:gx0+r()*gw|0,y:gy0+r()*skyH*.8|0,p:r()});
  clouds=[];for(let i=0;i<9;i++)clouds.push({x:r()*(gw+80)-40,y:gy0+3+r()*(skyH*.55),w:14+r()*22|0,s:.5+r()*.8});
  drops=[];for(let i=0;i<Math.max(6,gw/14);i++)drops.push({x:gx0+r()*gw|0,y:gy0+r()*L.gh,v:0,t:r()*4});
  rain=[];for(let i=0;i<gw*.7;i++)rain.push({x:r()*(gw+30),y:r()*L.gh,v:150+r()*90});
  snow=[];for(let i=0;i<gw*.5;i++)snow.push({x:r()*gw,y:r()*L.gh,v:9+r()*14,p:r()*6.28,b:r()<.25})}

function tree(c,x,y,rad){for(let j=-rad;j<=rad;j++){const w=Math.round(Math.sqrt(rad*rad-j*j)*1.25);R(c,x-w-1,y+j,2*w+2,1,A('#1f4a30'));R(c,x-w,y+j,2*w,1,A(j<0?'#4fa84c':'#35803f'))}
  R(c,x-rad+1,y-rad+1,2,1,A('#8fdc6a'));R(c,x-1,y-rad+2,3,1,A('#72c85a'));R(c,x+1,y,2,1,A('#2b6a38'))}

function drawSky(c){const{gx0,gx1,gy0,gy1,hz,gw,skyH}=L,img=c.getContext('2d'),id=img.createImageData(gw,gy1-gy0),B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]],N=13;
  for(let y=0;y<gy1-gy0;y++)for(let x=0;x<gw;x++){const v=clamp(y/skyH,0,1)*N,b=Math.floor(v),k=clamp(b+((v-b)*16>B[y&3][x&3]?1:0),0,N)/N,o=(y*gw+x)*4;
    id.data[o]=lerp(env.top[0],env.bot[0],k);id.data[o+1]=lerp(env.top[1],env.bot[1],k);id.data[o+2]=lerp(env.top[2],env.bot[2],k);id.data[o+3]=255}
  img.clearRect(0,0,W,H);img.putImageData(id,gx0,gy0);
  const disc=(x,y,r,col)=>{for(let j=-r;j<=r;j++){const w=Math.round(Math.sqrt(r*r-j*j));R(img,x-w,y+j,2*w+1,1,col)}};
  const clearish=1-Math.pow(env.w.cc,2);
  if(env.el>-3&&clearish>.15){const x=gx0+(env.az-205)/110*gw|0,y=hz-env.el/46*skyH|0,low=clamp(1-env.el/12,0,1);
    if(low>.2){img.globalAlpha=.25*low*clearish;disc(x,y,11,'#ffb060');img.globalAlpha=.3*low*clearish;disc(x,y,8,'#ffc878');img.globalAlpha=1}
    img.globalAlpha=clamp(clearish+.2,0,1);disc(x,y,5,rgb(mix([255,246,190],[255,150,80],low)));img.globalAlpha=1}
  if(env.el<-3&&clearish>.1){const h=(env.hour+12)%24,x=gx0+gw*(.16+.68*clamp((h-5)/14,0,1))|0,y=gy0+skyH*(.2+.25*Math.pow((h-12)/7,2))|0,ph=moonPhase(env.date);
    img.globalAlpha=clamp(clearish+.1,0,1);disc(x,y,4,'#f4f0d8');R(img,x-1,y-1,1,1,'#d8d4b8');R(img,x+1,y+1,2,1,'#d8d4b8');
    const off=Math.round((ph<.5?-1:1)*(1-Math.abs(ph-.5)*2)*9);if(Math.abs(off)>1)disc(x+off,y,4,rgb(env.top));img.globalAlpha=1}}

function drawCity(c0){const c=c0.getContext('2d'),{gx0,gx1,gy1,hz,gw,skyH,plat}=L;c.clearRect(0,0,W,H);
  const hazy=env.w.cc>.7,FAR=hazy?'#8794a8':'#86a2c8',FARL=hazy?'#98a4b6':'#a4bcdc',NEAR=hazy?'#667488':'#5d7ba6',NEARL=hazy?'#7a8698':'#7896c0',WIN=hazy?'#56637a':'#4a6690';
  const tower=(b,body,lit,win)=>{const y=hz-6-b.h;R(c,b.x,y,b.w,b.h+6,A(body));R(c,b.x,y,1,b.h+6,A(lit));if(b.step)R(c,b.x+1,y-2,b.w-2,2,A(body));if(b.ant)R(c,b.x+(b.w>>1),y-5,1,5,A(body));
    if(win)for(let yy=y+2;yy<hz-7;yy+=3)for(let xx=b.x+1;xx<b.x+b.w-1;xx+=2)R(c,xx,yy,1,1,A(win))};
  sky.far.forEach(b=>tower(b,FAR,FARL));
  const sp=sky.spire,sy=hz-6-sp.h;R(c,sp.x,sy+Math.round(sp.h*.4),8,sp.h,A('#9cc0e4'));R(c,sp.x+1,sy+7,6,sp.h,A('#9cc0e4'));R(c,sp.x+2,sy+3,4,5,A('#9cc0e4'));
  R(c,sp.x+1,sy+7,1,sp.h,A('#d0e6fa'));R(c,sp.x+5,sy+7,2,sp.h,A('#7ea4cc'));R(c,sp.x+3,sy-8,1,11,A('#9cc0e4'));
  sky.near.forEach(b=>tower(b,NEAR,NEARL,WIN));
  /* far shore: low brick blocks, trees, piers */
  const r=seeded(5);for(let x=gx0;x<gx1;){const w=6+(r()*9|0),h=3+(r()*4|0);R(c,x,hz-h,w,h,A(r()<.5?'#a8715a':'#936050'));R(c,x,hz-h,w,1,A('#c08a70'));for(let i=x+1;i<x+w-1;i+=2)R(c,i,hz-h+2,1,1,A('#5a3a34'));x+=w+(r()*3|0)}
  for(let x=gx0;x<gx1;x+=3)R(c,x+(r()*2|0),hz-2,2,2,A(r()<.5?'#3f8a45':'#2f6e3c'));
  /* river */
  const WA=hazy?'#58748e':'#3d7cc6',WB=hazy?'#4b6680':'#3069b0',WC=hazy?'#40586e':'#2a5a9c';
  R(c,gx0,hz,gw,gy1-hz,A(WA));R(c,gx0,hz,gw,3,A(WC));R(c,gx0,hz+3,gw,3,A(WB));for(let x=gx0;x<gx1;x+=2)R(c,x,hz+6,1,1,A(WB));
  R(c,gx0,hz,gw,1,A('#d8d0c0'));
  /* bridge on the left */
  const tx=gx0+Math.round(gw*.07),deck=hz-9,th=Math.round(skyH*.34);
  R(c,gx0,deck,Math.round(gw*.46),2,A('#6c6470'));R(c,gx0,deck+2,Math.round(gw*.46),1,A('#4a4450'));
  for(let x=gx0;x<gx0+gw*.46;x+=5)R(c,x,deck+3,1,hz-deck-3,A('#5a5460'));
  const cable=(x0,x1)=>{const n=Math.abs(x1-x0);for(let i=0;i<=n;i++){const t=i/n,x=x0+(x1-x0)*t|0,y=hz-th+2+(deck-3-(hz-th+2))*(1-Math.pow(1-t,2))|0;R(c,x,y,1,1,A('#4e4a58'));if(i%3===0)R(c,x,y+1,1,deck-y-1,A('#8a8494'))}};
  cable(tx+4,gx0+Math.round(gw*.44));cable(tx+4,gx0-12);
  R(c,tx,hz-th,9,th,A('#a89a8c'));R(c,tx,hz-th,2,th,A('#c4b6a6'));R(c,tx-1,hz-th,11,2,A('#8c7e72'));
  R(c,tx+2,deck-9,2,9,A('#5a4e50'));R(c,tx+5,deck-9,2,9,A('#5a4e50'));R(c,tx+2,deck-10,1,1,A('#a89a8c'));R(c,tx+6,deck-10,1,1,A('#a89a8c'))}

function drawNear(c0){const c=c0.getContext('2d'),{gx0,gx1,gy1,bT,wx1,x2,bT2,gw}=L,r=seeded(23);c.clearRect(0,0,W,H);
  /* waterfront park in the gap */
  const py=bT2+3;R(c,wx1,py,x2-wx1,gy1-py,A('#4a9648'));R(c,wx1,py,x2-wx1,1,A('#c8c0a8'));R(c,wx1,py+7,x2-wx1,3,A('#d8c890'));
  for(let x=wx1+3;x<x2-1;x+=7)tree(c,x,py+3+(r()*2|0),3);for(let x=wx1+5;x<x2;x+=8)tree(c,x,py+15,4);
  /* brick warehouse with roof garden */

  if(wet(k)){for(const d of drops){d.t-=dt;if(d.t<=0){d.v=rnd(6,22);if(Math.random()<.3){d.v=0;d.t=rnd(.5,3)}else d.t=rnd(.3,1.2)}d.y+=d.v*dt;if(d.y>gy1){d.y=gy0;d.x=gx0+Math.random()*gw|0}
      ctx.fillStyle='rgba(225,238,252,.85)';ctx.fillRect(d.x,d.y|0,1,2);ctx.fillStyle='rgba(225,238,252,.3)';ctx.fillRect(d.x,(d.y|0)-3,1,3)}}
  ctx.restore();
  ctx.drawImage(layers.room,0,0);
  /* steam, fairy lights */
  {const mgx=gx0+Math.round(gw*.4),my=L.sillY-8;ctx.fillStyle='rgba(253,246,227,.55)';for(let i=0;i<5;i++){const p=(t*.5+i*.2)%1;ctx.fillRect(mgx+3+Math.round(Math.sin(p*6+i)*1.5),my-(p*10|0),1,1)}}
  {const on=env.el<3,cols=['#f8d682','#ea3f98','#8acbfa','#acea7e','#f2a444'];for(let i=0,x=gx0-L.ft+2;x<gx1+L.ft-2;x+=7,i++){const u=(x-gx0)/gw,y=L.top-3+Math.round(Math.sin(u*Math.PI*3)*2+2);
      R(ctx,x,y-1,1,1,I('#2a2030'));const tw=on&&Math.sin(t*.8+i*1.7)>-.7;ctx.fillStyle=tw?cols[i%5]:I('#7a6a80');ctx.fillRect(x,y,2,2);if(tw){ctx.globalAlpha=.25;ctx.fillRect(x-1,y-1,4,4);ctx.globalAlpha=1}}}
}

/* ---------- previews: #rain, #snow-night, #dusk ... or keys W (weather), T (+1 hour), R (back to live) ---------- */
const HOURS={night:1,dawn:6.4,morning:9,noon:12.5,afternoon:15,dusk:16.6,evening:19};
function applyHash(){const parts=location.hash.slice(1).toLowerCase().split('-');forced=null;tOff=0;
  for(const p of parts){if(PRESET[p])forced=p;if(HOURS[p]!==undefined){tOff=0;tOff=(HOURS[p]-nycHour(new Date()))*36e5}}envT=99;env.key='';dirty=true}
addEventListener('hashchange',applyHash);
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),ks=Object.keys(PRESET);
  if(k==='w')forced=ks[(ks.indexOf(forced)+1)%ks.length];else if(k==='t')tOff+=36e5;else if(k==='r'){forced=null;tOff=0}else return;envT=99;env.key=''});
addEventListener('resize',fit);
applyHash();fit();computeEnv();hud();getWeather();setInterval(getWeather,6e5);requestAnimationFrame(frame);
})();
</script>
