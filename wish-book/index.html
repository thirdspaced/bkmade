<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>The Big Wish Book 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Bowlby+One&family=EB+Garamond:ital,wght@1,500;1,700&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
/* Layout idea: a printed 1998 mail-order catalog lying on a tartan tablecloth. Fixed-size print pages
   (600 x 780) scaled to fit, tiled with flat process-color panels, tiny condensed copy, dot-leader prices.
   The only "software" on screen is the crayon palette, drawn as a late-90s paint program toolbox. */
:root{
  color-scheme: light;
  --paper:#F3EFE2;
  --ink:#14213A;
  --cloth:#1D5A3C;
  --cranberry:#8E1626;
  --teal:#49B3AA;
  --peri:#8CA8E0;
  --slate:#AEC0D2;
  --sale:#D4145A;
  --chrome:#C3C3C3;
  --copy:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"EB Garamond",Garamond,"Times New Roman",serif;
  --kid:"Bowlby One","Arial Black",Impact,sans-serif;
  --ui:Tahoma,"MS Sans Serif",Geneva,Verdana,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--cloth);color:var(--ink);font-family:var(--copy);overflow:hidden;display:flex;
  background-image:
   repeating-linear-gradient(0deg,rgba(244,210,90,.5) 0 2px,transparent 2px 96px),
   repeating-linear-gradient(90deg,rgba(244,210,90,.5) 0 2px,transparent 2px 96px),
   repeating-linear-gradient(0deg,rgba(142,22,38,.62) 0 30px,transparent 30px 96px),
   repeating-linear-gradient(90deg,rgba(142,22,38,.62) 0 30px,transparent 30px 96px);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #FFD400;outline-offset:2px}

/* ---------- toolbox (paint program chrome) ---------- */
#tools{flex:none;width:118px;background:var(--chrome);border:2px solid;border-color:#fff #555 #555 #fff;font-family:var(--ui);font-size:12px;color:#000;display:flex;flex-direction:column;gap:6px;padding:3px;overflow:auto;z-index:20}
#tools h1{margin:0;background:#0A246A;color:#fff;font-size:12px;font-weight:bold;padding:4px 6px;letter-spacing:.3px}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.grp.c3{grid-template-columns:repeat(3,1fr)}
.lbl{grid-column:1/-1;font-size:11px;padding:1px 2px 0}
.tb{min-height:40px;background:var(--chrome);border:2px solid;border-color:#fff #555 #555 #fff;padding:2px;font-size:12px;font-weight:bold;display:grid;place-items:center;line-height:1.05}
.tb:active,.tb[aria-pressed="true"]{border-color:#555 #fff #fff #555;background-color:#e2e2e2;background-image:repeating-conic-gradient(#fff 0 25%,#d4d4d4 0 50%);background-size:4px 4px}
.tb.wide{grid-column:1/-1}
.tb svg{width:22px;height:22px;display:block}
.sw{min-height:30px;border:2px solid;border-color:#555 #fff #fff #555;background:var(--c);padding:0}
.sw[aria-pressed="true"]{outline:3px solid #000;outline-offset:-1px;box-shadow:inset 0 0 0 2px #fff}
.dot{display:block;border-radius:50%;background:#000}
#wishBtn b{display:block;font-size:18px}
body.bar{flex-direction:column-reverse}
body.bar #tools{width:auto;flex-direction:row;align-items:stretch;overflow-x:auto;overflow-y:hidden;gap:8px}
body.bar #tools h1{display:none}
body.bar .grp{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:46px;grid-template-rows:40px}
body.bar .grp.col{grid-template-rows:20px 20px;grid-auto-columns:30px}
body.bar .lbl{display:none}
body.bar .sw{min-height:0}
body.bar .tb.wide{grid-column:auto}
body.bar .tb{min-width:46px}

/* ---------- stage + book ---------- */
#stage{flex:1;position:relative;overflow:hidden;min-width:0;min-height:0}
#book{position:absolute;left:0;top:0;width:1200px;height:780px;transform-origin:0 0;perspective:2600px;transition:transform .8s cubic-bezier(.22,.8,.2,1)}
#stage.closed #book{animation:bob 5.5s ease-in-out infinite}
@keyframes bob{50%{translate:0 -7px}}
.leaf{position:absolute;left:600px;top:0;width:600px;height:780px;transform-origin:0 50%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform 1s cubic-bezier(.4,.05,.2,1);box-shadow:0 8px 14px rgba(0,0,0,.4)}
.leaf.flipped{transform:rotateY(-180deg)}
.leaf.turning{pointer-events:none}
.leaf.flipped .face.front,.leaf:not(.flipped) .face.back{pointer-events:none}
.face{position:absolute;inset:0;background:var(--paper);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;background:linear-gradient(90deg,rgba(20,16,10,.26),rgba(20,16,10,0) 7%)}
.face.back::after{background:linear-gradient(270deg,rgba(20,16,10,.26),rgba(20,16,10,0) 7%)}
.leaf.turning .face::before{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.25) 60%,rgba(0,0,0,.12));animation:sheen 1s ease-in-out}
@keyframes sheen{0%,100%{opacity:0}50%{opacity:1}}
canvas.ink{position:absolute;inset:0;width:100%;height:100%;z-index:5;mix-blend-mode:multiply;touch-action:none;cursor:crosshair}
.fold{position:absolute;bottom:0;width:34px;height:34px;z-index:7;border:0;padding:0;background:linear-gradient(135deg,#e2dcc9 0 50%,rgba(0,0,0,.34) 50% 56%,rgba(29,90,60,.9) 56%)}
.face.front .fold{right:0}
.face.back .fold{left:0;transform:scaleX(-1)}
.fold:active{width:44px;height:44px}
.fold::before{content:"";position:absolute;inset:-12px}
.arrow{position:absolute;top:50%;margin-top:-34px;width:40px;height:68px;z-index:15;background:var(--chrome);border:2px solid;border-color:#fff #555 #555 #fff;padding:0;display:grid;place-items:center}
.arrow:active{border-color:#555 #fff #fff #555}
.arrow i{width:0;height:0;border:11px solid transparent}
#prev{left:4px}#prev i{border-right-color:#000;margin-left:-11px}
#next{right:4px}#next i{border-left-color:#000;margin-right:-11px}
.arrow[disabled]{opacity:.35}
@media (max-width:560px){.arrow{display:none}}

/* ---------- print pages ---------- */
.pg{position:absolute;inset:0;padding:14px 14px 36px}
.folio{position:absolute;bottom:11px;font-weight:300;font-size:13px;letter-spacing:.2px}
.face.back .folio{left:44px}.face.front .folio{right:44px}
.foot{position:absolute;bottom:13px;left:110px;right:110px;text-align:center;font-size:8.5px;font-stretch:80%;line-height:1.15;color:#3b4252}
.grid{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(12,1fr);gap:4px;height:100%}
.panel{position:relative;background:var(--bg);display:flex;flex-direction:column;gap:5px;padding:7px 8px 6px;min-width:0;min-height:0;overflow:hidden}
.panel.wide{flex-direction:row;gap:10px}
.panel.wide .copy{flex:0 0 46%;align-self:flex-end}
.panel.wide.hero{flex-direction:column}
.panel.wide.hero .copy{flex:none;align-self:stretch;columns:2;column-gap:12px}
.sect{font-weight:250;font-stretch:100%;font-size:31px;line-height:.95;letter-spacing:-.6px;margin:0 0 1px}
.sect small{display:block;font-size:10.5px;font-weight:500;font-stretch:80%;letter-spacing:0;line-height:1.15;margin-top:4px;max-width:36ch}
.well{position:relative;flex:1;min-height:0;min-width:0;display:grid;place-items:center;background:rgba(255,255,255,.26);overflow:hidden}
.well img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.well.fpo::before{content:"";position:absolute;inset:6px;border:1px solid rgba(20,33,58,.55);
  background:linear-gradient(to top right,transparent calc(50% - .5px),rgba(20,33,58,.28) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),
             linear-gradient(to bottom right,transparent calc(50% - .5px),rgba(20,33,58,.28) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px))}
.fpo span.num{position:relative;background:var(--bg);padding:1px 8px 3px;font-weight:200;font-size:40px;line-height:1;letter-spacing:-1px}
.fpo em{position:absolute;left:9px;bottom:8px;font-style:normal;font-size:8px;font-stretch:80%;text-transform:uppercase;letter-spacing:.8px}
.fig{position:absolute;left:0;top:0;background:var(--ink);color:#fff;font-size:9.5px;font-weight:700;padding:1px 4px;z-index:2}
.flag{position:absolute;right:0;top:0;background:var(--sale);color:#fff;font-weight:800;font-stretch:75%;font-size:11px;letter-spacing:.6px;padding:2px 6px;text-transform:uppercase;z-index:2}
.copy{font-size:11.2px;line-height:1.17;font-stretch:76%;font-weight:450}
.copy b{font-weight:800}
.copy .sv{display:block;font-weight:800}
.pl{display:flex;align-items:baseline;gap:3px;font-weight:700;margin-top:2px;break-inside:avoid}
.pl i{flex:1;border-bottom:1.5px dotted currentColor;transform:translateY(-2px);min-width:8px}
.face.arrive .panel{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms + .35s)}
@keyframes rise{from{transform:translateY(10px);opacity:.35}}

/* cover: 1986-style red catalog cover. Thin white masthead, green keyline, and inside the keyline a scrapbook page
   where family prints and toy clippings are glued down together. */
.cover{background:#C5202C;color:#FBF3E4;position:absolute;inset:0;cursor:pointer;--mx:0;--my:0;overflow:hidden;
  background-image:linear-gradient(100deg,rgba(255,255,255,.07),transparent 18%,rgba(0,0,0,.06) 60%,transparent),repeating-linear-gradient(8deg,rgba(255,255,255,.035) 0 1px,transparent 1px 5px)}
.cover .mast{position:absolute;left:0;right:0;top:30px;text-align:center;font-weight:250;font-size:27.5px;letter-spacing:-.3px;line-height:1;white-space:nowrap;z-index:2}
.cover .mast svg{width:13px;height:16px;margin:0 9px -1px;display:inline-block}
.cover .frame{position:absolute;left:28px;right:28px;top:76px;bottom:54px;border:2.5px solid #1F7A4D;background:#1E5B3F;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px),repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px)}
.cover .free{position:absolute;right:30px;bottom:20px;font-weight:300;font-size:13px;z-index:2}
.cover .stk{position:absolute;left:346px;top:90px;width:212px;z-index:12;background:#F4F3EE;color:#1a1a1a;border-radius:6px;padding:5px 24px 6px 6px;display:grid;grid-template-columns:1fr 1fr;text-align:center;
  font-size:6.6px;font-weight:700;font-stretch:84%;text-transform:uppercase;letter-spacing:.3px;line-height:1.2;transform:rotate(-1.5deg);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.cover .stk div+div{border-left:1.5px solid #2A56B8}
.cover .stk b{display:block;font-size:11.5px;font-weight:600;letter-spacing:0;margin-top:1px;text-transform:none}
.cover .stk i{position:absolute;right:5px;top:50%;font-style:normal;color:#2A56B8;font-size:8.5px;font-weight:800;letter-spacing:0;text-transform:none;transform:translate(50%,-50%) rotate(-90deg);transform-origin:center;white-space:nowrap;right:13px}
.lay{position:absolute;left:var(--x);top:var(--y);width:var(--w);margin:0;z-index:var(--z,1);
  transform:translate(calc(var(--mx)*var(--d,6)*1px),calc(var(--my)*var(--d,6)*.8px)) rotate(var(--r,0deg));transition:transform .25s ease-out;animation:land .7s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--n)*110ms + .15s)}
@keyframes land{from{translate:0 -46px;scale:1.16;opacity:0}}
.mat{filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.mat .card{position:relative;background:var(--mc);padding:var(--pad,12px)}
.mat .card img{display:block;width:100%;height:auto;border-radius:3px}
.mat .stitch{position:absolute;inset:4.5px;border:1.5px dashed var(--sc,rgba(251,243,228,.9));pointer-events:none}
.mat figcaption,.mat .cap{font-family:"Reenie Beanie","Bradley Hand","Segoe Print",cursive;color:#1b3fa0;font-size:25px;line-height:.8;padding:7px 4px 0;text-align:center}
.hole{display:grid;place-items:center;width:100%;aspect-ratio:3/2;background:rgba(255,255,255,.4);border:1px dashed rgba(20,33,58,.55);color:#14213A;font-size:10px;font-weight:700;font-stretch:80%;text-transform:uppercase;letter-spacing:.8px}
.oval .hole{height:100%;aspect-ratio:auto;border-radius:50%}
.oval .card{border-radius:50%;padding:13px;height:var(--h)}
.oval .card img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.oval .stitch{border-radius:50%}
.print{position:absolute;left:var(--x);top:var(--y);width:var(--w);margin:0;background:#FBFAF4;padding:6px;box-shadow:0 2px 3px rgba(0,0,0,.5);z-index:var(--z,1);
  transform:translate(calc(var(--mx)*var(--d,6)*1px),calc(var(--my)*var(--d,6)*.8px)) rotate(var(--r));transition:transform .25s ease-out;animation:land .7s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--n)*110ms + .15s)}
.print img{display:block;width:100%;height:auto;border-radius:4px}
.print figcaption{font-family:"Reenie Beanie","Bradley Hand","Segoe Print",cursive;color:#1b3fa0;font-size:25px;line-height:.8;padding:7px 4px 1px;text-align:center}
.print::before{content:"";position:absolute;left:36%;top:-10px;width:62px;height:20px;background:rgba(244,228,160,.8);transform:rotate(-5deg)}
.gel{font-family:"Reenie Beanie","Bradley Hand","Segoe Print",cursive;font-size:27px;line-height:.8;color:#FBF3E4;white-space:nowrap;width:auto}
.snip{filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.snip .cut{background:#F7F4EA;padding:7px 7px 6px;color:var(--ink)}
.snip .well{height:74px;flex:none;background:var(--bg)}
.snip .fpo span.num{font-size:17px;font-weight:300;letter-spacing:0;padding:1px 5px 2px}
.snip b{display:block;font-size:10px;font-stretch:76%;font-weight:800;line-height:1.05;margin-top:4px}
.snip i{display:block;font-style:normal;font-size:10px;font-stretch:76%;font-weight:700;border-top:1.5px dotted currentColor;margin-top:3px;padding-top:1px;text-align:right}
.cover svg.ring{position:absolute;overflow:visible;pointer-events:none;inset:-12px -10px;width:calc(100% + 20px);height:calc(100% + 24px)}
.cover svg.ring path{fill:none;stroke:#D7263D;stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s 2.1s cubic-bezier(.5,0,.3,1) forwards;filter:url(#rough)}
@keyframes draw{to{stroke-dashoffset:0}}
.cover .open{position:absolute;left:28px;bottom:12px;z-index:9}
.cover .open button{background:#FBF3E4;color:#B01824;border:0;font-weight:800;font-stretch:112%;font-size:11px;letter-spacing:2.4px;text-transform:uppercase;padding:9px 13px;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
body.photomode canvas.ink{pointer-events:none}
body.photomode [data-ph]{outline:3px dashed var(--sale);outline-offset:-3px;cursor:pointer}
.tb[hidden]{display:none}
#photoMsg{font-size:11px;line-height:1.2;padding:0 2px;min-height:1em}

/* inside front */
.intro{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto 1fr auto;gap:4px;height:100%}
.intro>div{padding:12px 13px}
.intro h2{font-weight:250;font-size:33px;line-height:.95;letter-spacing:-.6px;margin:0 0 8px}
.intro h3{font-weight:800;font-stretch:76%;font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin:0 0 5px}
.intro p,.intro li{font-size:12.4px;line-height:1.24;font-stretch:80%;margin:0 0 6px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:7px;margin-bottom:8px}
.steps i{font-style:normal;background:var(--ink);color:#fff;font-size:10px;font-weight:700;height:15px;display:grid;place-items:center;margin-top:1px}
.belongs{grid-column:1/-1;background:var(--paper);border:1.5px solid var(--ink);padding:10px 14px 14px!important}
.belongs .line{border-bottom:1.5px solid var(--ink);height:74px}
.toc{list-style:none;margin:0;padding:0}
.toc li{display:flex;align-items:baseline;gap:3px;font-weight:600;margin-bottom:5px}
.toc li i{flex:1;border-bottom:1.5px dotted currentColor;transform:translateY(-2px)}
.coupon{border:2px dashed var(--ink);background:#F8E27A}
.coupon li{list-style:none;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(20,33,58,.4);padding:3px 0;margin:0;font-weight:600}
.coupon ul{margin:0;padding:0}

/* activity pages */
.act{position:absolute;inset:0;padding:22px 26px 34px;display:flex;flex-direction:column;gap:10px;background:var(--abg,#F8E27A)}
.act h2{font-family:var(--kid);font-weight:400;font-size:46px;line-height:.9;margin:0;letter-spacing:-.5px;color:var(--ink)}
.act h2 span{color:var(--sale)}
.act .dek{font-size:13.5px;font-stretch:84%;font-weight:600;line-height:1.22;margin:0;max-width:44ch}
.act .sheet{flex:1;min-height:0;background:var(--paper);border:2.5px solid var(--ink);display:grid;place-items:center;padding:12px;position:relative}
.act svg{max-width:100%;max-height:100%;display:block}
.act .again{position:absolute;right:26px;top:24px;z-index:6;border:2px dashed var(--ink);background:var(--paper);font-weight:800;font-stretch:78%;font-size:12px;text-transform:uppercase;letter-spacing:.6px;padding:9px 10px}
.ws{display:grid;grid-template-columns:repeat(11,1fr);width:100%;aspect-ratio:1;max-height:100%;font-weight:700;font-size:23px;font-stretch:100%}
.ws span{display:grid;place-items:center}
.words{display:flex;flex-wrap:wrap;gap:4px 16px;font-weight:800;font-stretch:80%;font-size:14px;letter-spacing:1px;margin:0;padding:0;list-style:none}

/* order form */
.order{position:absolute;inset:0;padding:18px 20px 28px;display:flex;flex-direction:column;gap:8px;-webkit-user-select:text;user-select:text}
.order h2{font-weight:250;font-size:34px;line-height:.95;letter-spacing:-.6px;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.order h2 small{font-size:10px;font-weight:700;font-stretch:80%;letter-spacing:.6px;text-transform:uppercase}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.fields label{border:1.5px solid var(--ink);padding:3px 7px 5px;font-size:9px;font-weight:700;font-stretch:80%;text-transform:uppercase;letter-spacing:.6px;display:block}
.fields input{display:block;width:100%;border:0;background:transparent;font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.1;padding:0;color:#1F5FD0}
.tablewrap{flex:1;min-height:0;overflow-y:auto;border:1.5px solid var(--ink);background:var(--paper)}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px;font-stretch:80%}
th{position:sticky;top:0;background:var(--ink);color:#fff;font-size:9px;text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:4px 6px;font-weight:700}
td{height:30px;padding:0 6px;border-right:1px solid rgba(20,33,58,.35);border-bottom:1px solid rgba(20,33,58,.35);font-weight:600;vertical-align:middle;line-height:1.05}
td:last-child,th:last-child{border-right:0;text-align:right;white-space:nowrap}
tr.sel td{background:#F8E27A}
tbody tr{cursor:pointer}
td.was{color:var(--sale);white-space:nowrap}
.find{border:2px dashed var(--ink);padding:7px 9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;font-stretch:80%;font-weight:600;min-height:52px}
.find span{flex:1 1 150px;line-height:1.15}
.find a,.obtn{background:var(--ink);color:#fff;text-decoration:none;font-weight:800;font-stretch:80%;font-size:12px;text-transform:uppercase;letter-spacing:.6px;padding:10px 11px;border:0}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:14px;font-stretch:80%}
.sum output{font-weight:250;font-stretch:100%;font-size:26px;letter-spacing:-.5px}
.fine{font-size:9.5px;font-stretch:80%;line-height:1.2;margin:0;color:#2b3345}
#copyout{width:100%;height:70px;font-family:var(--ui);font-size:11px;display:none}
.backc{position:absolute;inset:0;background:var(--cranberry);color:#F6ECD2;padding:46px 40px;display:flex;flex-direction:column;gap:14px;justify-content:flex-end;-webkit-user-select:text;user-select:text}
.backc .key{position:absolute;inset:14px;border:1.5px solid #F6ECD2;pointer-events:none}
.backc h2{font-family:var(--serif);font-style:italic;font-weight:700;font-size:60px;line-height:.9;margin:0 0 auto}
.backc p{margin:0;font-size:12.5px;font-stretch:82%;line-height:1.3;max-width:50ch}

    if(!s) return; var ctx=CTX[p], P=s.p; style(ctx,s);
    evs.forEach(function(ev){var q=pt(ev), n=P.length; if(Math.abs(q[0]-P[n-2])+Math.abs(q[1]-P[n-1])<1.2) return; P.push(q[0],q[1]); ctx.beginPath(); piece(ctx,P,P.length/2-1); ctx.stroke()});
  });
  function end(e){
    if(e.pointerId!==active) return; active=null;
    if(erased){ if(erased.length){pushUndo({k:"del",list:erased.slice().reverse(),pages:[p]}); remark(p); save()} erased=null; return }
    if(s){var P=s.p, n=P.length; if(n>=4){var ctx=CTX[p]; style(ctx,s); ctx.beginPath(); ctx.moveTo((P[n-4]+P[n-2])/2,(P[n-3]+P[n-1])/2); ctx.lineTo(P[n-2],P[n-1]); ctx.stroke()} pushUndo({k:"add",p:p,s:s}); s=null; remark(p); save()}
  }
  cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
}

/* ---------- which toys got marked ---------- */
var MARKS={};
function inPoly(x,y,P){var c=false; for(var i=0,j=P.length-2;i<P.length;j=i,i+=2){if((P[i+1]>y)!==(P[j+1]>y)&&x<(P[j]-P[i])*(y-P[i+1])/(P[j+1]-P[i+1])+P[i]) c=!c} return c}
function remark(p){
  var panels=FACES[p].querySelectorAll(".panel"), out={}; if(!panels.length){MARKS[p]={}; return}
  var R=[].map.call(panels,function(el){return {id:el.dataset.id,x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight}});
  (S.strokes[p]||[]).forEach(function(s){
    var P=s.p;
    if(s.t==="s"){R.forEach(function(r){if(P[0]>=r.x&&P[0]<=r.x+r.w&&P[1]>=r.y&&P[1]<=r.y+r.h) out[r.id]=1}); return}
    var n=P.length/2, x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, i;
    for(i=0;i<n;i++){x0=Math.min(x0,P[2*i]);x1=Math.max(x1,P[2*i]);y0=Math.min(y0,P[2*i+1]);y1=Math.max(y1,P[2*i+1])}
    var diag=Math.hypot(x1-x0,y1-y0), gap=Math.hypot(P[0]-P[2*n-2],P[1]-P[2*n-1]), got=false;
    if(n>8&&diag>50&&gap<diag*0.5) R.forEach(function(r){if(inPoly(r.x+r.w/2,r.y+r.h/2,P)){out[r.id]=1; got=true}});
    if(got) return;
    var best=null, bl=0;
    R.forEach(function(r){var len=0; for(i=1;i<n;i++){var mx=(P[2*i]+P[2*i-2])/2,my=(P[2*i+1]+P[2*i-1])/2; if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) len+=Math.hypot(P[2*i]-P[2*i-2],P[2*i+1]-P[2*i-1])} if(len>bl){bl=len;best=r}});
    if(best&&bl>=Math.min(best.w,best.h)*0.3) out[best.id]=1;
  });
  MARKS[p]=out; var c=marked().length; $("count").textContent=c;
  if(page===ORDER_PAGE||(isSpread()&&cur===ORDER_PAGE/2)) renderOrder();
}
function marked(){var ids=[]; for(var p in MARKS) for(var id in MARKS[p]) if(ITEMS[id]) ids.push(id); return ids.sort()}

/* ---------- order form ---------- */
var selId=null;
function shopLinks(name,link){var q=encodeURIComponent(name); return [["Amazon",link||"https://www.amazon.com/s?k="+q],["Target","https://www.target.com/s?searchTerm="+q],["Walmart","https://www.walmart.com/search?q="+q]]}
function renderOrder(){
  var ids=marked(), tb=$("rows"), total=0; if(!tb) return; tb.textContent="";
  if(ids.indexOf(selId)<0) selId=ids[0]||null;

    var tr=el("tr",id===selId?"sel":null); tr.tabIndex=0;
    tr.appendChild(el("td",null,it.page)); tr.appendChild(el("td",null,"WB "+it.no+" A")); tr.appendChild(el("td",null,it.n)); tr.appendChild(el("td","was",it.was?cents(it.was):"")); tr.appendChild(el("td",null,it.pl||cents(it.p)));
    function pick(){selId=id; renderOrder()} tr.addEventListener("click",pick); tr.addEventListener("keydown",function(e){if(e.key==="Enter") pick()});
    tb.appendChild(tr)});
  for(var i=ids.length;i<15;i++){var tr=el("tr"); for(var j=0;j<5;j++) tr.appendChild(el("td")); tr.style.cursor="default"; tb.appendChild(tr)}
  var find=$("find"); find.textContent="";
  if(selId){var it=ITEMS[selId]; find.appendChild(el("span",null,"Find "+it.n+" at:")); shopLinks(it.n,it.link).forEach(function(l){var a=el("a",null,l[0]); a.href=l[1]; a.target="_blank"; a.rel="noopener noreferrer"; find.appendChild(a)})}
  else find.appendChild(el("span",null,"Nothing marked yet. Flip back and circle the toys you love. They show up here."));
  $("sumTxt").textContent=ids.length+(ids.length===1?" wish. ":" wishes. ")+"Total, about";
  $("total").textContent="$"+Math.round(total);
  $("copyBtn").style.visibility=ids.length?"visible":"hidden";
}
function listText(){
  var out=["Dear "+(S.dear||"Nana")+",","",(S.name?S.name+"'s":"My")+" wish list from The Big Wish Book 2026:",""];
  marked().forEach(function(id,i){var it=ITEMS[id]; out.push((i+1)+". "+it.n+", $"+(it.pl||cents(it.p))+(it.was?" (reg. $"+cents(it.was)+")":"")+", spotted at "+it.at); out.push("   "+shopLinks(it.n,it.link)[0][1])});

$("copyBtn").addEventListener("click",function(){

var kn=$("kidname"), dr=$("dear"); kn.value=S.name||""; dr.value=S.dear||"Nana";
kn.addEventListener("input",function(){S.name=kn.value.trim(); save()}); dr.addEventListener("input",function(){S.dear=dr.value.trim(); save()});
var armed=false; $("resetBtn").addEventListener("click",function(){
  if(!armed){armed=true; this.textContent="Tap again to erase everything"; var b=this; setTimeout(function(){armed=false; b.textContent="Erase every page and start over"},4000); return}
  armed=false; this.textContent="Erase every page and start over"; var pages=[]; for(var p in S.strokes) pages.push(+p); S.strokes={}; UNDO=[]; pages.forEach(changed); goTo(0);
});

/* ---------- toolbox ---------- */
function press(group,match){[].forEach.call(group.querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",match(b)?"true":"false")})}
COLORS.forEach(function(c){var b=el("button","sw"); b.type="button"; b.style.setProperty("--c",c[1]); b.dataset.c=c[1]; b.setAttribute("aria-label",c[0]); b.addEventListener("click",function(){S.color=c[1]; if(S.tool==="e") setTool("c"); syncTools(); save()}); $("colors").appendChild(b)});

Object.keys(SHAPES).forEach(function(sh){var b=el("button","tb"); b.type="button"; b.dataset.sh=sh; b.setAttribute("aria-label",sh+" stamp"); var sv=svgEl("svg",{viewBox:"-1.2 -1.2 2.4 2.4","aria-hidden":"true"}); sv.appendChild(svgEl("path",{d:SHAPES[sh],fill:"#000"})); b.appendChild(sv); b.addEventListener("click",function(){S.shape=sh; setTool("s"); save()}); $("stamps").appendChild(b)});

  press($("toolGrp"),function(b){return b.dataset.tool===S.tool}); press($("colors"),function(b){return b.dataset.c===S.color});
  press($("sizes"),function(b){return +b.dataset.z===S.size}); press($("stamps"),function(b){return S.tool==="s"&&b.dataset.sh===S.shape});

[].forEach.call($("toolGrp").querySelectorAll("button"),function(b){b.addEventListener("click",function(){setTool(b.dataset.tool); save()})});

/* ---------- real toy photos: whoever can edit this page taps a slot and picks a picture from their device ---------- */
var DBX=null, ASSETS=null, LIVE={}, pickKey=null, picker=el("input"); picker.type="file"; picker.accept="image/*"; picker.id="photoPick"; picker.style.display="none"; document.body.appendChild(picker);
function note(t){$("photoMsg").textContent=t}
function setPhoto(key,url){
  [].forEach.call(document.querySelectorAll("[data-ph]"),function(w){
    if(w.dataset.ph!==key) return; var im=w.querySelector("img");
    if(!im){im=el("img"); im.alt=w.dataset.alt||""; im.draggable=false; im.addEventListener("error",function(){im.remove(); w.classList.add("fpo")}); w.appendChild(im)}
    w.classList.remove("fpo"); [].forEach.call(w.querySelectorAll(".num,em"),function(x){x.remove()}); im.src=url;
  });
}
function shrink(file){ // downscale to a small JPEG on white, so cutouts sit on the panel color
  return new Promise(function(res,rej){var u=URL.createObjectURL(file), im=new Image();
    im.onload=function(){var k=Math.min(1,900/Math.max(im.naturalWidth,im.naturalHeight)), cv=document.createElement("canvas"); cv.width=Math.max(1,Math.round(im.naturalWidth*k)); cv.height=Math.max(1,Math.round(im.naturalHeight*k));
      var x=cv.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,cv.width,cv.height); x.drawImage(im,0,0,cv.width,cv.height); URL.revokeObjectURL(u);
      cv.toBlob(function(b){b?res(b):rej(new Error("encode"))},"image/jpeg",.86)};
    im.onerror=function(){URL.revokeObjectURL(u); rej(new Error("That file is not a picture this page can read."))}; im.src=u});
}
document.addEventListener("click",function(e){
  if(!document.body.classList.contains("photomode")) return; var w=e.target.closest&&e.target.closest("[data-ph]"); if(!w) return;
  e.preventDefault(); e.stopPropagation(); pickKey=w.dataset.ph; picker.click();
},true);
picker.addEventListener("change",function(){
  var f=picker.files&&picker.files[0], key=pickKey; picker.value=""; if(!f||!key||!ASSETS||!DBX) return; note("Saving photo...");
  shrink(f).then(function(blob){return ASSETS.upload(blob,{type:"image/jpeg"})}).then(function(r){
    var old=LIVE[key]; LIVE[key]=r.id; setPhoto(key,r.url);
    return DBX.doc("photos/"+key).set({asset:r.id}).then(function(){ if(old&&old!==r.id) return ASSETS.delete(old).then(function(){},function(){}) });
  }).then(function(){note("Photo saved. Tap another slot.")},function(err){
    var c=err&&err.code; note(c==="too_large"?"That picture is too big.":c==="quota_or_state"?"Photo storage is full.":c==="rate_limited"?"Slow down a little, then try again.":(err&&!c&&err.message)||"That photo did not save. Try again.");
  });
});
$("photoBtn").addEventListener("click",function(){var on=document.body.classList.toggle("photomode"); this.setAttribute("aria-pressed",on?"true":"false"); this.textContent=on?"Done adding":"Add photos"; note(on?"Tap any dashed photo slot.":"")});
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("db").then(function(db){
    if(!db) return null; DBX=db;
    db.collection("photos").onSnapshot(function(snap){snap.docs.forEach(function(d){var v=d.data(); if(v&&typeof v.asset==="string"&&/^[A-Za-z0-9_-]{8,64}$/.test(v.asset)&&LIVE[d.id]!==v.asset){LIVE[d.id]=v.asset; setPhoto(d.id,"/_blob/"+v.asset)}})},function(){});
    return window.claude.use("assets");
  }).then(function(a){ if(a&&DBX){ASSETS=a; $("photoBtn").hidden=false} },function(){});
}

// Self-hosted copy: an optional photos.json beside this page maps a photo slot to a live image and a product link,
// e.g. {"updated":"2026-11-27T05:00:00Z","items":{"n101":{"img":"https://...","link":"https://..."}}}. tools/amazon-photos.mjs writes it. Slots are n101 to n149, plus c1 (NeeDoh) and c5 (Jellycat) on the cover.
fetch("photos.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(f){
  if(!f) return; var m=f.items||f, live=false;
  if(f.updated&&Date.now()-Date.parse(f.updated)>24*3600*1000) return; // Amazon image links may be kept for a day at most
  for(var k in m){var v=m[k]; if(!v) continue;
    if(typeof v.img==="string"&&/^https:\/\//.test(v.img)){setPhoto(k,v.img); live=true}
    if(typeof v.link==="string"&&/^https:\/\//.test(v.link)&&ITEMS[k]){ITEMS[k].link=v.link; live=true}}
  if(live){var d=el("p",null,"As an Amazon Associate I earn from qualifying purchases. Certain content that appears on this site comes from Amazon. This content is provided 'as is' and is subject to change or removal at any time."); var bc=document.querySelector(".backc"); if(bc) bc.insertBefore(d,$("resetBtn"));
    var fine=document.querySelector(".order .fine"); if(fine) fine.textContent+=" As an Amazon Associate I earn from qualifying purchases.";}
  renderOrder();
}).catch(function(){});

function restore(){for(var p=0;p<PAGES.length;p++){ if(CTX[p]){redraw(p); remark(p)} } renderOrder()}
restore(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(restore);
})();
